name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Autel SDK libs
        run: |
          git clone --depth 1 https://github.com temp_autel
          mkdir -p app/libs
          find temp_autel -name "*.aar" -o -name "*.jar" | xargs -I {} cp {} app/libs/
          rm -rf temp_autel
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDS-Drone-APK
          path: app/build/outputs/apk/debug/app-debug.apk

